name: Build HSU-Client
on:
  push:
    paths:
      - 'hsu-client/**'
      - 'hsu-library/**'
      - '.github/workflows/client_deployment_dev.yml'
    branches:
      - 'development'
      - 'stage'
      - 'master'
  workflow_dispatch:
    inputs:
      BRANCH_NAME:
        description: 'Define BRANCH_NAME branch'
        required: true
        default: 'development'

env:
  ProjectName: hsu-platform
  BRANCH_NAME: ${{ github.event.inputs.BRANCH_NAME }}
  BACKUP_TAG: ${{ github.event_name != 'workflow_dispatch' &&  github.run_number || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ startsWith(github.ref, 'refs/heads/development') && 'development' || startsWith(github.ref, 'refs/heads/stage') && 'stage' || startsWith(github.ref, 'refs/heads/master') && 'master' || 'unknown' }}
    steps:
    - name: Set env
      if: ${{ github.event_name != 'workflow_dispatch' }}
      run: |
        BRANCH_NAME=${GITHUB_REF##*/}
        echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

    - uses: actions/checkout@v1
    - name: Installing NodeJS
      uses: actions/setup-node@v1
      with:
        node-version: 16
    - name: Installing angular
      run: |
        npm install -g @angular/cli@13.3.6
        ng version

    - name: Set build environment
      env:
        BRANCH_NAME: ${{ env.BRANCH_NAME }}
      run: |
        if [ ${BRANCH_NAME} = "master" ]; then 
          echo "ENV=production" >> $GITHUB_ENV
        elif [ ${BRANCH_NAME} = "stage" ]; then 
          echo "ENV=stage" >> $GITHUB_ENV
        elif [ ${BRANCH_NAME} = "development" ]; then 
          echo "ENV=dev" >> $GITHUB_ENV
        else
          echo "ENV=unknown" >> $GITHUB_ENV
        fi
        echo "Set ENV to be used in next steps"
        
    - name: Build client application
      env:
        ENV: ${{ env.ENV }}
      run: |

        export NODE_OPTIONS="--max_old_space_size=4096"
        echo ${NODE_OPTIONS}
        echo "Building storybook"
        cd hsu-library
        npm i
        ng build
        cd -
        echo "Building storybook Done"
        
        cd hsu-client
        npm install --legacy-peer-deps
        ng build --configuration ${ENV}
        mkdir ng
        mv Dockerfile ng/
        mv default.conf ng/
        mv htpasswd ng/  
        mv dist/hsu-client/* ng/
        cd ng

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      env:
        ENV: ${{ env.ENV }}
        BACKUP_TAG: ${{ env.BACKUP_TAG }}
      run: docker build -t ghcr.io/${{ github.repository_owner }}/hsu-platform-client:${ENV} -t ghcr.io/${{ github.repository_owner }}/hsu-platform-client:${ENV}-${BACKUP_TAG} .
      working-directory: hsu-client/ng
        
    - name: Push Docker images
      env:
        ENV: ${{ env.ENV }}
        BACKUP_TAG: ${{ env.BACKUP_TAG }}
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/hsu-platform-client:${ENV}
        docker push ghcr.io/${{ github.repository_owner }}/hsu-platform-client:${ENV}-${BACKUP_TAG}
